<div class="content-page">
    <div class="content">
        <div class="bdcmb mt-2">
            <div class="row">
              <div class="col-sm-6 col-6">
                <h4 class="page-title">Dispatch</h4>
              </div>
    
              <div class="col-sm-6 col-6">
                <div class="b-links">
                  <a routerLink="/{{orgName}}/home">Home</a> / <a href="javascript:void(0)" routerLink="/{{orgName}}/dispatch">Dispatch</a>
                </div>
              </div>
            </div>
        </div>
      
        <div class="d-flex">


            <div class="col-md-3">
                <div class="service-request-card">
                    <div class="d-flex  sr-pending">
                        <h5 class="service-title text-primary">Pending Service Requests</h5>
                    </div>
                    <div class="item-container">
                        <div class="inner-card-wrapper" *ngFor="let item of mainItems" pDraggable (onDragStart)="onDragStart(item)"
                        (onDragEnd)="onDragEnd()">
                        <div class="inner-card">
                            <div class="ticket-detail">
                                <p><strong>Seller:</strong> {{item.sellerName}}</p>
                                <p><strong>Status:</strong> <span class="status">Active</span></p>
                                <p><strong>Pickup Date:</strong>  {{item.pickUpDate}}</p>
                            </div>
                           
                        </div>
        
        
                    </div>
                    </div>
                  
                </div>
            </div>
        
        
        
        
            <div class="col-9">
                <div class="target-boxes-container">
                    <div class="target-boxes">
                        <div class="target-box" *ngFor="let box of targetBoxes; let i = index" pDroppable (onDrop)="onDrop(i)">
                            <div class="d-flex justify-content-between  sr-pending">
                                <div>
                                    <div class="total-order" pTooltip="Pending Order">{{ box.orderCount + box.items.length}}
                                    </div>
                                </div>
                                <div class="text-primary">{{ box.sellerName }}</div>
                                <div class="d-flex">
                                    <div class="me-1 align-item-center">
                                        <img class="dash-icons" src="/assets/images/custom/icons/ship-out.png">
                                    </div>
                                    <div class="div"> <button (click)="op.toggle($event)" class="btn btn-light border"
                                            type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                            <i class="bi bi-three-dots"></i>
                                        </button>
                                    </div>
        
                                </div>
        
                            </div>
        
                            <div *ngFor="let item of box.items" class="dropped-item">
                                <div class="inner-card-wrapper">

                                    <div class="ticket-detail">
                                        <p><strong>Seller:</strong> {{item.sellerName}}</p>
                                        <p><strong>Status:</strong> <span class="status">Active</span></p>
                                        <p><strong>Pickup Date:</strong>  {{item.pickUpDate}}</p>
                                    </div>

                                   
                                    <p-progressBar [style]="{ height: '10px' }"></p-progressBar>
        
                                </div>
        
        
        
        
                            </div>
                        </div>
                    </div>
                </div>
        
        
            </div>
        
        
        </div>
        
    </div>
</div>






<p-overlayPanel #op>
    <img src="https://primefaces.org/cdn/primeng/images/demo/product/bamboo-watch.jpg" alt="product" />
</p-overlayPanel>
