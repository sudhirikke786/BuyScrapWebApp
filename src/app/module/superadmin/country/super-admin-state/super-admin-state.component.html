<div class="content">

    <!-- Start Content-->
    <div class="container-fluid">

        <!-- <div class="row mt-2">
            <div class="col text-center">
                <button type="button" class="btn btn-primary waves-effect waves-light btn-spl"><i class="mdi mdi-plus"></i> New Ticket</button> 
                <button type="button" class="btn btn-primary waves-effect waves-light btn-spl"><i class="mdi mdi-plus"></i> Merge Ticket and Pay</button>
            </div>          
        </div> -->

        <div class="bdcmb mt-2">
            <div class="row">
                <div class="col-sm-6 col-6">
                    <h4 class="page-title">State</h4>
                </div>

                <div class="col-sm-6 col-6">
                    <div class="b-links">
                        <a [routerLink]="['/superadmin/home']">Home</a>/<a [routerLink]="['/superadmin/country']">Country</a>/ <a >State</a>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-2 d-flex align-items-center">
            

            <div class="col-md-6 d-flex">
                <input type="text" [(ngModel)]="searchText" style="min-width:250px; width:auto" id="example-palaceholder" class="form-control" placeholder="Search State">

                <a type="button" class="btn btn-square-less-padd btn-primary waves-light ml-10" title="Search" (click)="getAllStates(searchText)"><i class="mdi mdi-cust mdi-magnify"></i></a>

                <a type="button" class="btn btn-square-less-padd btn-primary waves-light ml-10" title="Refresh" (click)="refreshStateList()"><i class="mdi mdi-cust mdi-refresh"></i></a>
                <a type="button" (click)="back()" class="btn btn-square-less-padd btn-primary waves-light ml-10" title="Add Location" >Back</a>
                <a type="button" label="Add/Edit System Preference" (click)="openDialog()" 
                class="btn btn-primary me-1 px-1 py-1 cursor-pointer ml-10">
   Add New State
</a>


            </div>
            
        </div>  
        <!-- end page title --> 

        <div class="row mt-2" >
            <div class="col-12">
                <div class="card">
                    <div class="card-body">

                        <p-table [value]="states" [scrollable]="true" 
                        scrollHeight="50vh" [paginator]="true" [rows]="10"
                        [showCurrentPageReport]="true" [tableStyle]="{ 'min-width': '50rem' }"
                        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
                        [rowsPerPageOptions]="commonService.tableConfig.pageOptions" 
                      
                        >

                       
                        
                        <ng-template pTemplate="header">
                            <tr>
                                <th>State Name</th>
                                <th>Prefix</th>
                                <th>Action</th>
                            </tr>
                        </ng-template>

                        
                        <ng-template pTemplate="body" let-states >
                            <tr>
                                <td>{{states.name}}</td>
                                <td>{{states.prefix}}</td>
                               
                                <td>
                                    <a  (click)="editSysPref(states)" class="btn btn-grid btn-primary waves-effect waves-light me-1"><i class="mdi mdi-pencil"></i> Edit</a>
                                    <a  (click)="showCity(states)" class="btn btn-grid btn-primary waves-effect waves-light me-1"><i class="mdi mdi-eye"></i> Show City</a>
                                     </td>
                            </tr>
                        </ng-template>
                        
                    </p-table>





                     
                    </div> <!-- end card body-->
                </div> <!-- end card -->
            </div><!-- end col-->
        </div>


     

</div>
<p-dialog [modal]="true" [header]="selectedSysPrefEntity ? 'Add State' : 'Edit State'" [(visible)]="sysPrefModalVisible" 
    [style]="{width: '40vw'}" [breakpoints]="{'767px': '100vw'}" (onHide)="onDialogHide()">
    
    <div class="row">
        <div class="col-sm-12">
            <form>
                
                <!-- Key Input -->
                <div class="form-group col-sm-12 mb-2">
                    <div class="form-floating">
                        <input type="text" class="form-control" placeholder="Enter State Name"  [(ngModel)]="selectedSysPrefEntity.name" name="key"/>
                        <label>Country Name</label>
                    </div>
                </div>

                <!-- Value Input -->
                <div class="form-group col-sm-12 mb-2">
                    <div class="form-floating">
                        <textarea class="form-control" rows="3" placeholder="Enter Prefix" [(ngModel)]="selectedSysPrefEntity.prefix" name="value"></textarea>
                        <label>Prefix</label>
                    </div>
                </div>

                <!-- Error Message -->
                <div *ngIf="errorMsgVisibility" class="text-danger">
                    {{ errorMsg }}
                </div>

                <!-- Save Button -->
                <div class="text-center mt-3">
                    <button type="button" class="btn btn-primary" (click)="saveState()">Save</button>
                </div>

            </form>
        </div>
    </div>

</p-dialog>
