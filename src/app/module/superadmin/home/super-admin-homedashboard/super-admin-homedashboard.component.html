<div class="content-page">

    <div class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="bdcmb mt-2">
                    <div class="row">
                        <div class="col-sm-6 col-6">
                            <h4 class="page-title">Location Management</h4>
                        </div>

                        <div class="col-sm-6 col-6">
                            <div class="b-links">
                                <a routerLink="/superadmin/home">Home</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>


        </div>

        <div class="row">
            <div  class="d-flex justify-content-end mt-1">
                <app-actionbar (iconAction)="getAction($event)" [actions]="actionList"></app-actionbar>
            </div>
        </div>
        <div class="row">
            <div class="card mt-2">
                <div class="card-body">
                    <p-table [value]="users">
                        <ng-template pTemplate="header">
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="body" let-user>
                            <tr>
                                <td>{{ user.name }}</td>
                                <td>{{ user.email }}</td>
                                <td>{{ user.status }}</td>
                            
                                <td>
            
                                    <div class="d-flex">
                                        <a class="btn btn-primary me-1" 
                                            > Edit </a>
                                        <a class="btn btn-primary me-1"
                                            > Location Management</a>
                                    </div>
                                </td>
                            </tr>
                        </ng-template>
                    </p-table>
            
                </div>
            </div>

        </div>

      


    </div>
</div>
