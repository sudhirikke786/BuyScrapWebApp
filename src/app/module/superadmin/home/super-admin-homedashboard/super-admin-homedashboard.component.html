<div class="content-page">

    <div class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="bdcmb mt-2">
                    <div class="row">
                        <div class="col-sm-6 col-6">
                            <h4 class="page-title">Location Management</h4>
                        </div>

                        <div class="col-sm-6 col-6">
                            <div class="b-links">
                                <a routerLink="/superadmin/home">Home</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>


        </div>

        <div class="row">
            <div  class="d-flex justify-content-end mt-1">
                <app-actionbar (iconAction)="getAction($event)" [actions]="actionList"></app-actionbar>
            </div>
        </div>
        <div class="row">
            <div class="card mt-2">
                <div class="table-responsive">
                    <p-table [value]="users">
                        <ng-template pTemplate="header">
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="body" let-user>
                            <tr>
                                <td>{{ user.databaseName }}</td>
                                <td>{{ user.emailID }}</td>
                                <td>{{ user.isActive ? 'Active' : 'Deactive' }}</td>
                            
                                <td>
            
                                    <div class="d-flex">
                                        <a class="btn btn-primary me-1" (click)="credentialM()"
                                            > Edit </a>
                                        <a class="btn btn-primary me-1" (click)="getlocations(user.organisationName)"
                                            > Location Management</a>
                                    </div>
                                </td>
                            </tr>
                        </ng-template>
                    </p-table>
                    <div class="text-center mt-3">
                        <button class="btn btn-danger fixed-bottom-btn" (click)="showDeletedOrganizations()">
                            Show Deleted Organizations
                        </button>
                    </div>
                </div>
            </div>

        </div>

      


    </div>
</div>


<p-dialog [modal]="true" [breakpoints]="{'767px': '100vw'}" header="Deleted Users" [(visible)]="showDeletedPopup" [style]="{ width: '70vw' }">
    <div class="row">
        <div class="col-md-12" >
            <p-table #dt1 [value]="deletedUsers" [paginator]="false" [rows]="10" [showCurrentPageReport]="true"
                [tableStyle]="{ 'min-width': '50rem' }" [rowsPerPageOptions]="[5, 10, 20, 50]" [scrollable]="true"
                scrollHeight="80vh" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries">

                <ng-template pTemplate="header">
                    <tr>
                       
                        <th>Name</th>
                        <th>Email</th>
                        <th>Status</th>
                    </tr>
                </ng-template>
                
                <ng-template pTemplate="body" let-user>
                    <tr>
                        <td>{{ user.databaseName }}</td>
                        <td>{{ user.emailID }}</td>
                        <td>{{ user.isActive ? 'Deactive' : 'Deactive' }}</td>
                       
                    </tr>
                </ng-template>

                <ng-template pTemplate="footer">
                    <div class="d-flex">
                        <a class="btn btn-primary me-1" (click)="closeDeletedPopup()">Close</a>
                    </div>
                </ng-template>

            </p-table>
        </div>

     
    </div>
</p-dialog>
