<div class="content-page" >
  <div class="content">
    <!-- Start Content-->
    <div class="container-fluid">
      <div class="bdcmb mt-2">
        <div class="row">
          <div class="col-sm-6 col-6">
              <h4 class="page-title">Credential Mangment</h4>
          </div>

          <div class="col-sm-6 col-6">
              <div class="b-links">
                  <a routerLink="/superadmin/home">Home</a> / <a href="javscript:void()" >Credential Mangment</a>
              </div>
          </div>
        </div>
      </div>

<div class="credential-container">
    <div class="credential-card">
      <h2 class="title">Credentials Management</h2>
  
      <div class="form-group">
        <div class="input-group">
          <label>First Name</label>
          <input type="text" [(ngModel)]="reportData.firstName" placeholder="Enter First Name">
        </div>
        <div class="input-group">
          <label>Last Name</label>
          <input type="text" [(ngModel)]="reportData.lastName" placeholder="Enter Last Name">
        </div>
      </div>
  
      <div class="form-group">
        <div class="input-group">
          <label>Username</label>
          <input type="text" [(ngModel)]="reportData.userName"  placeholder="Enter Username">
        </div>
        <div class="input-group">
          <label>Mobile Number</label>
          <input type="text" [(ngModel)]="reportData.mobileNumber" placeholder="Enter Mobile Number">
        </div>
      </div>
  
      <div class="form-group">
        <div class="input-group">
          <label>Password</label>
          <input type="password" [(ngModel)]="reportData.password" placeholder="Enter Password">
        </div>
        <div class="input-group">
          <label>Confirm Password</label>
          <input type="password"  [(ngModel)]="reportData.password" placeholder="Confirm Password">
        </div>
      </div>
  
      <div class="form-group single">
        <div class="input-group">
          <label>Email ID</label>
          <input type="email" [(ngModel)]="reportData.emailID" placeholder="Enter Email">
        </div>
      </div>
  
      
  
      <button class="save-btn" (click)="saveUserData()">Save</button>
  
      <div  class="error-message">
        
      </div>
    </div>
  </div>
