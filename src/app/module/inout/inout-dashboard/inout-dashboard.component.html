<div class="content-page" *ngIf="!showLoader">
  <div class="content">
    <!-- Start Content-->
    <div class="container-fluid">
      <div class="bdcmb mt-2">
        <div class="row">
          <div class="col-sm-6 col-6">
            <h4 class="page-title">In Out</h4>
          </div>

          <div class="col-sm-6 col-6">
            <div class="b-links">
              <a routerLink="/{{orgName}}/home">Home</a> / <a href="javscript:void()" routerLink="/{{orgName}}/inout">In Out</a>
            </div>
          </div>
        </div>
      </div>

      <div class="row mt-2">
        <div class="col-md-6 d-flex">
          <input type="text" id="example-palaceholder" [(ngModel)]="serachText" class="form-control" (keyup.enter)="getAllInoutDetails()"
              placeholder="Search ...">    
        </div>
        <div class="col-md-6">
          <app-actionbar (iconAction)="getInoutAction($event)"  [actions]="actionList"></app-actionbar>
        </div>
      </div>
      <!-- end page title -->

      <div class="row mt-2">
        <div class="col-12">
          <div class="card">
            <div class="card-body">
              <p-table
                [value]="inouts"
                [paginator]="true"
                [rows]="10"
                [scrollable]="true" 
                scrollHeight="50vh"
                [showCurrentPageReport]="true"
                [tableStyle]="{ 'min-width': '50rem' }"
                currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
                [rowsPerPageOptions]="commonService?.tableConfig?.pageOptions"
              >
             
                <ng-template pTemplate="header">
                  <tr>
                    <th>In Out #</th>
                    <th>Date Created</th>
                    <th>Total Net</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </ng-template>
                <ng-template pTemplate="body" let-inout>
                  <tr>
                    <td [ngClass]="{'bg-danger text-white': inout.isDeleted}">{{ inout.rowId }}</td>
                    <td [ngClass]="{'bg-danger text-white': inout.isDeleted}">{{ inout.createdDate | date: 'MM/dd/yyyy' }}</td>
                    <td [ngClass]="{'bg-danger text-white': inout.isDeleted}">{{ inout.totalNet }}</td>
                    <td [ngClass]="{'bg-danger text-white': inout.isDeleted}">{{ inout.status }}</td>
                    <td [ngClass]="{'bg-danger text-white': inout.isDeleted}">
                      <a type="button"routerLinkActive="router-link-active" (click)="showDetails(inout.rowId)"
                        class="btn btn-grid btn-success waves-effect waves-light me-1">
                          <i class="mdi mdi-eye"></i> Show
                      </a>
                      <a *ngIf="!inout.isDeleted" data-bs-toggle="modal" data-bs-target="#capture-image" (click)="editDetails(inout.rowId)"
                      class="btn btn-grid btn-primary waves-effect waves-light me-1">
                          <i class="mdi mdi-pencil"></i> Edit
                      </a>                       
                      <a *ngIf="!inout.isDeleted" class="btn btn-grid btn-danger waves-effect waves-light" (click)="confirmationMessage(inout.rowId)">
                          <i class="mdi mdi-trash-can-outline"></i> Delete
                      </a>
                    </td>
                  </tr>
                </ng-template>
                <ng-template pTemplate="paginatorleft">
                  <p-button
                    type="button"
                    icon="pi pi-plus"
                    styleClass="p-button-text"
                  >
                  </p-button>
                </ng-template>
                <ng-template pTemplate="paginatorright">
                  <p-button
                    type="button"
                    icon="pi pi-cloud"
                    styleClass="p-button-text"
                  >
                  </p-button>
                </ng-template>
              </p-table>
            </div>
            <!-- end card body-->
          </div>
          <!-- end card -->
        </div>
        <!-- end col-->
      </div>
      <!-- end row-->
    </div>
    <!-- container -->
  </div>
  <!-- content -->

  <!-- Footer Start -->

  <!--  New In Out Modal Popup -->

  <!--  New In Out Modal Popup -->

  <!--  Select New Driver Modal Popup -->

  <!--  Select New Driver Modal Popup -->
</div>



<div class="content-page" *ngIf="showLoader">
  


  <app-page-loader type="ftable"></app-page-loader>

</div>

<p-dialog [modal]="true" 
  header="Select Location"
  [(visible)]="visible"
  [style]="{ width: '30vw' }"
>


<div *ngIf="showPageLoader">
  <app-page-loader type="ftable"></app-page-loader>

</div>





<div *ngIf="!showPageLoader">
  <div class="row">
    <div class="col-md-6">
      <input type="text" id="example-palaceholder" [(ngModel)]="searchLocationInput" class="form-control"
          placeholder="Search for Location" (keyup.enter)="getAllLocatoins()">
    </div>
    <div class="col-md-6">
        <app-actionbar (iconAction)="getLocationAction($event)"  [actions]="newButtonList"></app-actionbar>
    </div>
  </div>



  <div class="row mt-3">

    <p-table #dt1 [value]="locations" [paginator]="true" [rows]="10"
    [showCurrentPageReport]="true" [tableStyle]="{ 'min-width': '20rem' }"
    [scrollable]="true" 
    scrollHeight="50vh"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    >    
      <ng-template pTemplate="header">
          <tr>
              <th>Location Name</th>      
              <th>Action</th>
          </tr>
      </ng-template>
      <ng-template pTemplate="body" let-location>
          <tr>
            <td>{{ location?.locationName }}</td>      
            <td>
              <a (click)="showCustomerModel(location)" class="btn btn-primary">Select</a>
            </td>
      </tr>
      </ng-template>
    </p-table>   
  </div>
</div>


 
</p-dialog>
