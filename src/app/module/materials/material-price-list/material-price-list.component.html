<div *ngIf="error" class="error">{{ error }}</div>

<div *ngIf="!error">
  <div class="bdcmb mt-2">
    <div class="row">
        <div class="col-sm-6 col-6">
            <h4 class="page-title">Materials</h4>
        </div>

        <div class="col-sm-6 col-6">
          <div class="b-links">
            <a routerLink="/{{orgName}}/home">Home</a> /
            <a routerLink="/{{orgName}}/materials">Materials</a> /
            <a routerLink="/{{orgName}}/materials/materialpricelist">Material Price Details</a>
          </div>
        </div>
        
    </div>
</div>
    <div class="table-controls">
        <!-- Back Button -->
        <a class="btn btn-primary waves-effect waves-light ticket-edit me-1" routerLink="/{{orgName}}/materials" style="margin: 15px;">
          Back
        </a>
        
    
        <!-- Checkboxe -->
        <div class="checkbox-controls">
          <label>
            <input type="checkbox"  /> Blank Price
          </label>
          <button class="view-report-button">View Report</button>
        </div>
    </div>
  <div class="scroll-container">
    <ng-container *ngFor="let group of getGroupKeys()">
      <!-- Group Name -->
      <div class="group-name">
        <h3>{{ group }}</h3>
      </div>

      <!-- Material Table -->
      <table class="material-table">
        <thead>
          <tr>
            <th>Material Name</th>
            <th>Material Price</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of groupedData[group]">
            <td>{{ item.materialName }}</td>
            <td> <input
              type="number"
              [(ngModel)]="item.scrapPrice"
              class="form-control form-control-sm"
            /></td>
          </tr>
        </tbody>
      </table>
    </ng-container>
  </div>
</div>
