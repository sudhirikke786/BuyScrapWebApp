                                </div>

                                <div class="col-sm-6 col-6">
                                    <div class="b-links">

                                                        </div>

                                                            <div (click)="showDialog()" class="btn btn-outline-primary" style="width:75px"><i class="mdi mdi-pencil"></i> Edit</div>
                                                        </div>
                                                    </div>



                                                    <!-- <div class="materials-pg-boxes">
                                                        <a routerLink = "/{{orgName}}/materials/{{item.rowId}}">
                                                            {{item.groupName}}
                                                        </a>
                                                        <div class="d-flex justify-content-center px-1 py-1">
                                                          
                                                            <div (click)="showDialog()" class="btn -pg waves-effect waves-light cursor-pointer"><i class="mdi mdi-pencil"></i> Edit</div>
                                                        </div>
                                                    </div>   -->
                                                </ng-container>

                                            </div>
                                            
                                        </ng-container>
                                        <ng-container *ngIf="!mainMaterialsVisible" >
                                            <div class="img-grid">
                                                <ng-container *ngFor="let item of subMaterialList" >
                                                    <div class="materials-pg-boxes">

                                                        <div  class="title">
                                                            <!-- <img src="{{item.imagePath}}" (error)="this.changeSource($event);" /> -->
                                                            {{item.materialName}}
                                                        </div>
                                                        <div class="d-flex justify-content-between px-2 py-1">
                                                            <div>Scrap Price - {{item.scrapPrice | currency: currencySymbol :'symbol': numberFormat}}</div>
                                                            <div><a (click)="showDialog(item)"class="btn btn-outline-primary" ><i class="mdi mdi-pencil"></i> Edit</a></div>
                                                        </div>
                                                       
                                                        <!-- <ul class="materials-name-edit-ul">
                                                            <li class="fz-14"><b>{{item.materialName}}</b></li>
                                                        </ul>
                                                        <div class="d-flex justify-content-between px-2 py-1">
                                                            <div>Scrap Price - {{item.scrapPrice}}</div>
                                                            <div><a (click)="showDialog(item)" class="btn -pg waves-effect waves-light"><i class="mdi mdi-pencil"></i> Edit</a></div>
                                                        </div> -->
                                                    </div>

                                                </ng-container>


                                            </div>
                                            
                                        </ng-container>
                                        </div>
                                    </div> <!-- end card body-->
                                </div> <!-- end card -->
                            </div><!-- end col-->
                        </div>
                        <!-- end row-->     
                        
                    </div> <!-- container -->

                </div> <!-- content -->

            </div>


            <div class="content" *ngIf="showLoader">
                <app-page-loader type="image"></app-page-loader>
            </div>
     

            <p-dialog [modal]="true" 
                [header]="isEditModeOn == true? 'Edit Sub-Material' : 'Add Sub-Material'"
                [(visible)]="visible"
                [style]="{ width: '60vw' }"
                [breakpoints]="{'767px': '100vw'}"
            >
                <div class="row">
                                    
                    <div class="col-sm-12">
                        <form [formGroup]="form">
                            <div class="row">
                                <div class="form-group col-sm-6 mb-2">
                                    <div class="form-floating">
                                        <label hidden formControlName="rowId">0</label>
                                        <input formControlName="materialName" type="text" class="form-control">
                                        <label for="floatingInput">Product Name</label>
                                    </div>
                                </div>

                                <div class="form-group col-sm-6 mb-2">
                                    <div class="form-floating">                                        
                                        <select class="form-select" formControlName="groupId">
                                            <option *ngFor="let option of materialList"
                                            [value]="option.rowId">
                                                {{ option.groupName }}
                                            </option>
                                        </select>
                                        <label for="floatingInput">Product Group</label>
                                    </div>
                                    <!-- <label for="example-select" class="form-label">Units of Measure</label> -->
                                </div>
                            </div>

                            <div class="form-group col-sm-12 mb-2">                            
                                <div class="form-floating">
                                    <input formControlName="description" type="text" class="form-control">
                                    <label for="floatingInput">Description</label>
                                </div>
                            </div>

                            <div class="row">
                                <div class="form-group col-sm-4 mb-2">
                                    <div class="form-floating">
                                        <input formControlName="marketPrice" type="text" class="form-control">
                                        <label for="floatingInput">Market Price</label>
                                    </div>
                                </div>
                                <div class="form-group col-sm-4 mb-2">
                                    <div class="form-floating">
                                        <input formControlName="scrapPrice" type="text" class="form-control"  [readonly]="form.get('priceMapWithMarket')?.value">
                                        <label for="floatingInput">Scrap Price</label>
                                    </div>
                                </div>
                                <div class="form-group col-sm-4 mb-2" *ngIf="currentRole=='Administrator'">
                                    <button class="btn btn-primary"  (click)="enablePriceItem()">Edit</button>
                                </div>
                                <div class="form-group col-sm-4 mb-2" *ngIf="currentRole=='Cashier'">
                                    <button class="btn btn-primary"  (click)="enableCashier()">Edit</button>
                                </div>
                            </div>

                            <div class="row">
                                <div class="form-group col-sm-4 mb-2 d-flex align-items-center">
                                    <div class="form-check form-switch">
                                    <input type="checkbox" class="form-check-input" id="priceMapWithMarket"
                                            formControlName="priceMapWithMarket"
                                            (change)="onPriceMapWithMarketChange()" />
                                    <label class="form-check-label ms-2" for="priceMapWithMarket">Price Map With Market</label>
                                    </div>
                                </div>

                                <div class="form-group col-sm-4 mb-2 d-flex align-items-center" *ngIf="form.get('priceMapWithMarket')?.value">
                                    <label class="me-2">Percentage:</label>
                                    <input type="number" class="form-control" formControlName="percentageOnMarketPrice"
                                        (input)="calculateScrapPriceFromMarket()" style="width: 100px;" />
                                </div>
                            </div>


                            <div class="row">
                                <div class="form-group col-sm-4 mb-2 d-flex align-items-center">
                                    <div class="form-floating me-2" style="flex: 1;">
                                        <input formControlName="dealerPrice1" type="text" class="form-control form-control-sm" class="form-control form-control-sm" style="width: 200px;">
                                        <label for="floatingInput">Dealer 1</label>
                                    </div>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" id="dealer1Percentage" formControlName="dealerType1" value="P">
                                            <label class="form-check-label" for="dealer1Percentage">%</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" id="dealer1Dollar" formControlName="dealerType1" value="D">
                                            <label class="form-check-label" for="dealer1Dollar"> {{ currencySymbol }}</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group col-sm-4 mb-2 d-flex align-items-center">
                                    <div class="form-floating me-2" style="flex: 1;">
                                        <input formControlName="dealerPrice2" type="text" class="form-control form-control-sm" class="form-control form-control-sm" class="form-control form-control-sm" style="width: 200px;">
                                        <label for="floatingInput">Dealer 2</label>
                                    </div>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" id="dealer2Percentage" formControlName="dealerType2" value="P">
                                            <label class="form-check-label" for="dealer2Percentage">%</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" id="dealer2Dollar" formControlName="dealerType2" value="D">
                                            <label class="form-check-label" for="dealer2Dollar">{{ currencySymbol }}</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group col-sm-4 mb-2 d-flex align-items-center">
                                    <div class="form-floating me-2" style="flex: 1;">
                                        <input formControlName="dealerPrice3" type="text" class="form-control form-control-sm" class="form-control form-control-sm" class="form-control form-control-sm" style="width: 200px;">
                                        <label for="floatingInput">Dealer 3</label>
                                    </div>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" id="dealer3Percentage" formControlName="dealerType3" value="P">
                                            <label class="form-check-label" for="dealer3Percentage">%</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" id="dealer3Dollar" formControlName="dealerType3" value="D">
                                            <label class="form-check-label" for="dealer3Dollar">{{ currencySymbol }}</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group col-sm-4 mb-2 d-flex align-items-center">
                                    <div class="form-floating me-2" style="flex: 1;">
                                        <input formControlName="dealerPrice4" type="text" class="form-control form-control-sm" style="width: 200px;">
                                        <label for="floatingInput">Dealer 4</label>
                                    </div>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" id="dealer4Percentage" formControlName="dealerType4" value="P">
                                            <label class="form-check-label" for="dealer4Percentage">%</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" id="dealer4Dollar" formControlName="dealerType4" value="D">
                                            <label class="form-check-label" for="dealer4Dollar">{{ currencySymbol }}</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group col-sm-4 mb-2 d-flex align-items-center">
                                    <div class="form-floating me-2" style="flex: 1;">
                                        <input formControlName="dealerPrice5" type="text" class="form-control form-control-sm" style="width: 200px;">
                                        <label for="floatingInput">Dealer 5</label>
                                    </div>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" id="dealer5Percentage" formControlName="dealerType5" value="P">
                                            <label class="form-check-label" for="dealer5Percentage">%</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" id="dealer5Dollar" formControlName="dealerType5" value="D">
                                            <label class="form-check-label" for="dealer5Dollar">{{ currencySymbol }}</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        <div class="row">
                            <div class="form-group col-sm-6 mb-2 d-flex align-items-center gap-2">
                                <div class="form-check me-2" >
                                    <input type="checkbox" class="form-check-input" id="isHold" formControlName="isHold">
                                    <label class="form-check-label" for="isHold">Payment Hold</label>
                                </div>
                                <ng-container *ngIf="form.get('isHold')?.value">
                                    <label for="holdDays">Hold Payment:</label>
                                    <input type="number" class="form-control" id="holdDays" formControlName="holdDays" min="0" style="width: 100px;">
                                </ng-container>
                            </div>

                            <!-- <div class="form-group col-sm-6 mb-2 d-flex align-items-center gap-2">
                                <div class="form-check me-2">
                                    <input type="checkbox" class="form-check-input" id="tag" formControlName="tag">
                                    <label class="form-check-label" for="tag">Tag and Hold</label>
                                </div>
                                <ng-container *ngIf="form.get('tag')?.value">
                                    <label for="holdPeriod">Hold Period:</label>
                                    <input type="number" class="form-control" id="holdPeriod" formControlName="holdPeriod" min="0" style="width: 100px;">
                                </ng-container>
                            </div> -->
                        </div>
                        <div class="row">
                            <div class="form-group col-sm-4 mb-2">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="isEnable"  formControlName="isEnable">
                                    <label class="form-check-label" for="isEnable">Enable</label>
                                </div>
                            </div>
                            <div class="form-group col-sm-4 mb-2">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="isExpense" formControlName="isExpense">
                                    <label class="form-check-label" for="isExpense">Is Expense</label>
                                </div>
                            </div>
                        </div>


                            <!-- <div class="form-group col-sm-12 mb-2">
                                <button class="btn btn-primary" onclick="document.getElementById('upload').click()">Upload Image</button>
                                <input type='file' id="upload" style="display:none">

                                <div id="image-preview" class="mt-10"></div>
                            </div> -->

                            <a class="btn btn-primary " (click)="onSubmit(materialData)">Save</a>

                        </form>
                    </div>

                </div>
            </p-dialog>         

            <!-- ============================================================== -->
            <!-- End Page content -->
            <!-- ============================================================== -->



            <p-dialog [modal]="true" header="Camera Settings"   [(visible)]="cashVisible" [style]="{ width: '20vw' }" [breakpoints]="{'767px': '100vw'}">
                <ng-template pTemplate="header">
            
                    <div class="d-flex">
                        <a class="btn btn-primary " (click)="cashVisible=false"><i class="mdi mdi-keyboard-backspace"></i></a>
            
                        <h4 class="modal-title ml-10" id="myLargeModalLabel">Material Edit Permission</h4>
                    </div>
            
                </ng-template>
                <div class="row" *ngIf="cashVisible">
                    <div class="col-sm-12">                        
            
                            <div class="form-group col-sm-12 mb-2">
                                <label for="materialkey" class="form-label w-100">Material Price Edit Key</label>
                                <input required type="password" id="materialkey" name="materialkey" class="form-control" 
                                  placeholder="Enter Material Key" [(ngModel)]="materialkey" > 
                            </div>
            
                            <button class="btn btn-primary " (click)="connectToUpdate()">Submit</button>
                       
                    </div>
                </div>
              
            </p-dialog>

            <p-toast></p-toast>
