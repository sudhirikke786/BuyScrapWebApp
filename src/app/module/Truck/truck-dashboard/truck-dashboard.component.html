            <p-dialog [modal]="true" [header]="headerTitle" [(visible)]="visible" [style]="{width: '600px'}">
                <div class="my-form-grid">

                    <!-- Row 1 -->
                    <div class="form-field">
                    <label>Truck Name</label>
                    <input pInputText type="text" placeholder="Enter Truck Name" />
                    </div>

                    <div class="form-field">
                    <label>Status</label>
                    <p-dropdown
                        [options]="statusOptions"
                        optionLabel="label"
                        optionValue="value"
                        placeholder="Select Status">
                    </p-dropdown>
                    </div>

                    <!-- Row 2 -->
                    <div class="form-field">
                    <label>Truck Type</label>
                    <p-dropdown
                        [options]="truckTypeOptions"
                        optionLabel="label"
                        optionValue="value"
                        placeholder="Select Truck Type">
                    </p-dropdown>
                    </div>

                    <div class="form-field">
                    <label>Plate State</label>
                    <input pInputText type="text" placeholder="Enter Plate State" />
                    </div>

                    <!-- Row 3: License Plate spans both columns -->
                    <div class="form-field full">
                    <label>License Plate</label>
                    <input pInputText type="text" placeholder="Enter License Plate" />
                    </div>

                </div>

                <ng-template pTemplate="footer">
                    <button pButton label="Cancel" class="p-button-text" (click)="visible = false"></button>
                    <button pButton label="Save"></button>
                </ng-template>
            </p-dialog>
