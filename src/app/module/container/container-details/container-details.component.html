<div class="content-page" *ngIf="!showLoader">
    <div class="content">
        <!-- Start Content-->
        <div class="container-fluid">
            <div class="bdcmb mt-2">
                <div class="row">
                    <div class="col-sm-6 col-6">
                        <h4 class="page-title">Sub Containers</h4>
                    </div>
                    <div class="col-sm-6 col-6">
                        <div class="b-links">
                            <a routerLink="/{{orgName}}/home">Home</a> / <a href="javascript:void()"
                                routerLink="/{{orgName}}/container">Container</a>/ <a href="javascript:void()"
                                routerLink="/{{orgName}}/container/sub container">Sub Containers</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mt-2">
                <div class="col-md-6 d-flex">
                    <input type="text" id="example-palaceholder" class="form-control" placeholder="Search Sub Container"
                        [(ngModel)]="searchText">
                </div>
                <div class="col-md-6">
                    <app-actionbar (iconAction)="getAction($event)" [actions]="actionList"></app-actionbar>
                </div>
            </div>
            <!-- end page title -->

            <div class="row mt-2">
                <div class="col-12">
                    <div class="card custom-height">
                        <div class="card-body">
                            <div class="row">
                                <div class="img-grid">
                                    <ng-container *ngFor="let item of filteredContainerList">
                                        <div class="materials-pg-boxes">
                                            <div class="title">
                                                <strong>{{item.containerNumber}}</strong>
                                                <br />
                                                <small class="text-muted">{{item.description}}</small>
                                            </div>
                                            <div class="d-flex justify-content-center px-1 py-1 gap-2">
                                                <div *ngIf="currentRole!='Scale'" (click)="showDialog(item)"
                                                    class="btn btn-outline-primary">
                                                    <i class="mdi mdi-pencil"></i> Edit
                                                </div>
                                                <!-- <div *ngIf="currentRole!='Scale'" class="btn btn-outline-primary" (click)="openHistory()">
                                                            <i class="mdi mdi-history"></i> History
                                                        </div> -->
                                            </div>
                                        </div>
                                    </ng-container>
                                </div>
                            </div>
                        </div> <!-- end card body-->
                    </div> <!-- end card -->
                </div><!-- end col-->
            </div>
            <!-- end row-->
        </div> <!-- container -->
    </div> <!-- content -->
</div>

<div class="content" *ngIf="showLoader">
    <app-page-loader type="image"></app-page-loader>
</div>

<!-- ============================================================== -->
<!-- End Page content -->
<!-- ============================================================== -->

<p-dialog [modal]="true" [header]="headerTitle" [(visible)]="visible" [style]="{width: '60vw'}"
    [breakpoints]="{'767px': '100vw'}">
    <div class="row">
        <div class="col-sm-12">
            <form [formGroup]="form">
                <div class="form-group col-sm-12 mb-2">
                    <div class="form-floating">
                        <input formControlName="containerNumber" type="text" class="form-control" id="containerNumber">
                        <label for="containerNumber">Sub Container Number</label>
                    </div>
                </div>

                <div class="form-group col-sm-12 mb-2">
                    <div class="form-floating">
                        <input formControlName="description" type="text" class="form-control" id="description">
                        <label for="description">Description</label>
                    </div>
                </div>

                <button type="button" class="btn btn-primary" (click)="onSubmit(containerData)">Save</button>
                <button type="button" class="btn btn-secondary ms-2" (click)="visible = false">Cancel</button>
            </form>
        </div>
    </div>
</p-dialog>

<p-dialog header="Pickup History" [(visible)]="historyVisible" [modal]="true" [style]="{width: '60vw'}">

    <table class="table table-bordered table-sm">
        <thead>
            <tr>
                <th>Pickup Id</th>
                <th>Date</th>
                <th>Status</th>
                <th>Dispatch Type</th>
                <th>From Location</th>
                <th>To Location</th>
            </tr>
        </thead>

        <tbody>
            <tr *ngFor="let h of historyList">
                <td>{{ h.pickupId }}</td>
                <td>{{ h.date }}</td>
                <td>{{ h.status }}</td>
                <td>{{ h.dispatchType }}</td>
                <td>{{ h.fromLocation }}</td>
                <td>{{ h.toLocation }}</td>
            </tr>
        </tbody>
    </table>

</p-dialog>

<p-toast></p-toast>
