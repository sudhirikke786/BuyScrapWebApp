            <!-- ============================================================== -->
            <!-- Start Page Content here -->
            <!-- ============================================================== -->

            <div class="content-page" *ngIf="!showLoader">
                <div class="content">
                  <!-- Start Content-->
                  <div class="container-fluid">
                    <div class="bdcmb mt-2">
                      <div class="row">
                        <div class="col-sm-6 col-6">
                            <h4 class="page-title">Container Tracking Report</h4>
                        </div>

                        <div class="col-sm-6 col-6">
                            <div class="b-links">
                                <a routerLink="/{{orgName}}/home">Home</a> / <a href="javscript:void()" routerLink="/{{orgName}}/reports">Reports</a> / <a href="javscript:void()" routerLink="/{{orgName}}/reports/material-report" >Container Tracking Report</a>
                            </div>
                        </div>
                      </div>
                    </div>
              
                    <div class="row mt-2">
                      <div class="col-sm-6 d-flex mb-2">
                        <input type="text" id="containerName" [(ngModel)]="containerName" name="containerName" class="form-control mr-10" placeholder="Search by Container No.">

                      </div>  
                      <div class="col-sm-6 mb-2">
                        <app-actionbar (iconAction)="getAction($event)"  [actions]="actionList"></app-actionbar>
                      </div>
                    </div>
                    <!-- end page title -->
              
                    <div class="row mt-2">
                      <div class="col-sm-12">
                        <div class="card">
                          <div class="card-body">
                            <p-table
                              [value]="reportData"
                              [rows]="10"
                              [scrollable]="true" 
                              scrollHeight="65vh"
                              [showCurrentPageReport]="true"
                              [tableStyle]="{ 'min-width': '50rem' }" >
                           
                              <ng-template pTemplate="header">
                                <tr>
                                  <th>PickUpID</th>
                                  <th>PickUp Date</th>
                                  <th>Type</th>
                                  <th>Status</th>
                                  <th>Container Number</th>
                                  <th>Address</th>
                                </tr>
                              </ng-template>
                              <ng-template pTemplate="body" let-rowData>
                                <tr>
                                  <td>{{ rowData.rowID }}</td>
                                  <td>{{ rowData.pickUpDate }}</td>
                                  <td>{{ rowData.type }}</td>
                                  <td>{{ rowData.status }}</td>
                                  <td>{{ rowData.containerNumber }}</td>
                                  <td>{{ rowData.pickUpAddress }}</td>
                                </tr>
                              </ng-template>
                            </p-table>
                          </div>
                          <!-- end card body-->
                        </div>
                        <!-- end card -->
                      </div>
                      <!-- end col-->
                    </div>
                    <!-- end row-->
                  </div>
                  <!-- container -->
                </div>
                <!-- content -->
              
                <!-- Footer Start -->
              
                <!--  New Ship Out Modal Popup -->
              
                <!--  New Ship Out Modal Popup -->
              
                <!--  Select New Driver Modal Popup -->
              
                <!--  Select New Driver Modal Popup -->
              </div>



              <div class="content" *ngIf="showLoader">

                <app-page-loader type="ftable"></app-page-loader>
              
                
              </div>


            <!-- ============================================================== -->
            <!-- End Page content -->
            <!-- ============================================================== -->
            <p-dialog [modal]="true" header="Container Tracking Report" [(visible)]="isReportShow" [modal]="true" [style]="{ width: '70vw' }">
              
              <div *ngIf="showDownload">
                <app-page-loader type="reportloader"></app-page-loader>
              </div>
             

              <div class="row">
                <div style="height: 500px;width:100%" *ngIf="!showDownload">
                
                  <ngx-extended-pdf-viewer   [base64Src]="fileDataObj" [filenameForDownload]="'Container Tracking Report'+ ' '+ '.pdf'"></ngx-extended-pdf-viewer>

                </div>

              </div>
