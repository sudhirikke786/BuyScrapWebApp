            <!-- ============================================================== -->
            <!-- Start Page Content here -->
            <!-- ============================================================== -->

            <div class="content-page" *ngIf="!showLoader">
                <div class="content">
                  <!-- Start Content-->
                  <div class="container-fluid">
                    <div class="bdcmb mt-2">
                      <div class="row">
                        <div class="col-sm-6 col-6">
                            <h4 class="page-title">Ship Out Report</h4>
                        </div>

                        <div class="col-sm-6 col-6">
                            <div class="b-links">
                                <a routerLink="/{{orgName}}/home">Home</a> / <a href="javscript:void()" routerLink="/{{orgName}}/reports">Reports</a> / <a href="javscript:void()" routerLink="/{{orgName}}/reports/ship-out-report" >Ship Out Report</a>
                            </div>
                        </div>
                      </div>
                    </div>
              
                    <div class="row mt-2">
                      <div class="col-sm-5 d-flex mb-1">
                        <input type="text" id="ticketNumber" [(ngModel)]="ticketNumber" name="ticketNumber" class="form-control mr-10" placeholder="Search by Shipout No.">

                        <input type="text" id="sellerName" [(ngModel)]="sellerName" name="sellerName" class="form-control" placeholder="Search by Buyer">
                      </div>
                      <div class="col-sm-5 d-flex  mb-1">
                        <label class="mr-10">From Date</label>
                        <input type="date" id="fromDate" [(ngModel)]="fromDate" name="fromDate" class="form-control mr-10" (click)="openDatePicker()">

                        <label class="mr-10">To Date</label>
                        <input type="date" id="toDate" [(ngModel)]="toDate" name="toDate" class="form-control" (click)="openToDatePicker()">
                      </div>  
                      <div class="col-sm-2  mb-1">
                        <app-actionbar (iconAction)="getAction($event)"  [actions]="actionList"></app-actionbar>
                      </div>
                    </div>
                    <!-- end page title -->
              
                    <div class="row mt-2">
                      <div class="col-12">
                        <div class="card">
                          <div class="card-body">
                            <p-table
                              [value]="reportData"
                              [rows]="10"
                              [scrollable]="true" 
                              scrollHeight="65vh"
                              selectionMode="single"
                              [(selection)]="customerObj"
                              (onRowSelect)="onRowSelect($event)"
                              (onRowUnselect)="onRowUnselect($event)"
                              [showCurrentPageReport]="true"
                              [tableStyle]="{ 'min-width': '50rem' }" >
                           
                              <ng-template pTemplate="header">
                                <tr>
                                  <th>Bill of Lading</th>
                                  <th>Date Created</th>
                                  <th>Carrier</th>
                                  <th>Total Net</th>
                                  <th>Buyer</th>
                                </tr>
                              </ng-template>
                              <ng-template pTemplate="body" let-shipout>
                                <tr [pSelectableRow]="shipout">
                                  <td [ngClass]="{'bg-danger text-white': shipout.isDeleted}">{{ shipout.rowId }}</td>
                                  <td [ngClass]="{'bg-danger text-white': shipout.isDeleted}">{{ shipout.createdDate | date: 'MM/dd/yyyy' }}</td>
                                  <td [ngClass]="{'bg-danger text-white': shipout.isDeleted}">{{ shipout.carrier }}</td>
                                  <td [ngClass]="{'bg-danger text-white': shipout.isDeleted}">{{ shipout.totalNet }}</td>
                                  <td [ngClass]="{'bg-danger text-white': shipout.isDeleted}">{{ shipout.customerName }}</td>
                                </tr>
                              </ng-template>
                            </p-table>
                          </div>
                          <!-- end card body-->
                        </div>
                        <!-- end card -->
                      </div>
                      <!-- end col-->
                    </div>
                    <!-- end row-->
                  </div>
                  <!-- container -->
                </div>
                <!-- content -->
              
                <!-- Footer Start -->
              
                <!--  New Ship Out Modal Popup -->
              
                <!--  New Ship Out Modal Popup -->
              
                <!--  Select New Driver Modal Popup -->
              
                <!--  Select New Driver Modal Popup -->
              </div>

              <div class="content" *ngIf="showLoader">

                <app-page-loader type="ftable"></app-page-loader>
              
                
              </div>
  

            <!-- ============================================================== -->
            <!-- End Page content -->
            <!-- ============================================================== -->
            <ng-container *ngIf="!checkTabView">


            <p-dialog   header="Shipout Report" [(visible)]="isReportShow" [modal]="true" [style]="{ width: '70vw' }">
             
              <div *ngIf="showLoaderReport">
                <app-page-loader type="reportloader"></app-page-loader>
              </div>

              <div class="row" >
                <div style="height: 500px;" *ngIf="!showLoaderReport">                
                  <ngx-extended-pdf-viewer   [base64Src]="fileDataObj"></ngx-extended-pdf-viewer>
                </div>
              </div>
            </p-dialog>
            </ng-container>
